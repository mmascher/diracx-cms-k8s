apiVersion: v1
kind: ConfigMap
metadata:
  name: diracx-container-entrypoint
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/resource-policy": keep
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail
    IFS=$'\n\t'

    ulimit -n 8192

    if [ -f "/activate.sh" ]; then
      source /activate.sh
    else
      eval "$(micromamba shell hook --shell=posix)" && micromamba activate base
    fi

    if [ -f /cs_config/default.yml ]; then
      echo "Using provided Configuration Service file: /cs_config/default.yml"
      if [ -f /cs_store/initialRepo/default.yml ] && [ -f /cs_config/default.yml ]; then
        echo "Copy /cs_config/default.yml to /cs_store/initialRepo/default.yml"
        rm /cs_store/initialRepo/default.yml
        cp /cs_config/default.yml /cs_store/initialRepo/default.yml
        echo "ls -al /cs_store/initialRepo/default.yml"
        # the default.yml file is provided locally
        # we MUST run git commit on this rewrite to make sure
        # that master branch contains this changes
        # see diracx implementation in core/config/sources.py
        # https://github.com/DIRACGrid/diracx/blob/main/diracx-core/src/diracx/core/config/sources.py
        cd /cs_store/initialRepo/
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        git commit -m "update" -a
        cd -
      fi
    fi

    # enable update of developer code if requested
    {{ if .Values.diracx.pythonModulesToInstall }}
    pip install{{ if .Values.developer.offline }} --no-build-isolation{{ end }} {{- range $moduleSpec := .Values.diracx.pythonModulesToInstall }} {{ $moduleSpec | quote }} {{- end }}
    {{- end }}

    {{ if and .Values.developer.enabled .Values.developer.mountedPythonModulesToInstall }}
    {{- range $moduleName := .Values.developer.mountedPythonModulesToInstall }}
    if [ -d "{{ $.Values.developer.sourcePath }}/{{ $moduleName }}" ]; then
      pip install{{ if $.Values.developer.offline }} --no-build-isolation{{ end }} {{ if $.Values.developer.editableMountedPythonModules }}-e {{ end }}"{{ $.Values.developer.sourcePath }}/{{ $moduleName }}"
    fi
    {{- end }}
    {{- end }}

    {{- if and .Values.developer.enabled .Values.developer.enableCoverage }}
    SITE_PACKAGES_DIR=$(python -m sysconfig | grep platlib | head -n 1 | cut -d '=' -f 2 | cut -d '"' -f 2)
    echo "Enabling coverage using pth file in SITE_PACKAGES_DIR=${SITE_PACKAGES_DIR}"
    echo 'import coverage; coverage.process_startup()' > "${SITE_PACKAGES_DIR}/coverage.pth"
    export COVERAGE_PROCESS_START=/diracx-coveragerc
    {{- end }}

    exec "$@"

{{- if and .Values.developer.enabled .Values.developer.enableCoverage }}
  coveragerc: |
    [run]
    data_file=/coverage-reports/coverage
    relative_files=True
    parallel=True
    sigterm=True
    omit =
        **/diracx/client/*
        **/diracx/testing/*
    include =
        */site-packages/diracx/*
        /{{ .Values.developer.sourcePath }}/*

    [paths]
    source =
        */src/
        */site-packages/
        /{{ .Values.developer.sourcePath }}/*/src/
        /{{ .Values.developer.sourcePath }}/*/*/src/
{{- end }}
